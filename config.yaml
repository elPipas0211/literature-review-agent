sources:
  openalex:
    # Optional contact email. The API key is a secret, so it is NOT set here:
    # use Settings in the app, or OPENALEX_API_KEY=... in .env (git-ignored).
    email: ""

# Quality flags are LABELS ONLY: nothing is deleted. Turn the citation floor on
# if you want old, rarely cited papers marked as "below_citation_floor".
citation_floors:
  enabled: false
  pre_2015:
    year_cutoff: 2015      # year < 2015
    min_citations: 500
  mid_range:
    year_from: 2015        # 2015 <= year <= 2020
    year_to: 2020
    min_citations: 100

# Relevance score = ranking aid (see src/evaluation/scoring.py)
evaluation:
  # Raw cosine similarities from multilingual-e5 fall in a narrow band; this
  # range is mapped linearly to semantic_score 0..1. Recalibrate if you change
  # the model (measured: off-topic ~0.75, on-topic ~0.85-0.90).
  similarity_range: [0.75, 0.90]
  weights:
    semantic: 0.80
    impact: 0.20
  citation_ref: 300        # citations at which impact_score saturates at 1.0
  thresholds:
    relevant: 0.55         # score >= this -> "relevante"
    potentially: 0.35      # score >= this -> "potencialmente_relevante", else "no_relevante"

keywords:
  per_paper: 5           # KeyBERT keyphrases stored per paper (computed once)

embeddings:
  # Multilingual: write the context / questions in Spanish or English,
  # papers in English are matched across languages.
  model: "intfloat/multilingual-e5-small"
  query_prefix: "query: "
  passage_prefix: "passage: "

storage:
  projects_dir: "projects"
